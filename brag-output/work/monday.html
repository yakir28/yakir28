<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:M;font-weight:500;src:url(fonts/poppins-latin-500-normal.woff2)}
@font-face{font-family:M;font-weight:600;src:url(fonts/poppins-latin-600-normal.woff2)}
@font-face{font-family:M;font-weight:700;src:url(fonts/poppins-latin-700-normal.woff2)}
@font-face{font-family:M;font-weight:800;src:url(fonts/poppins-latin-800-normal.woff2)}
:root{--bg:#EDEFFA;--ink:#323338;--muted:#676879;--purple:#6161FF}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:M,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.abs{position:absolute}
.orb{border-radius:50%;background:radial-gradient(circle at 30% 28%,#9DBBFF 0%,#8C7BFF 32%,#C64DF2 64%,#FF8CC6 100%);filter:blur(14px)}
.bub{width:140px;height:140px;margin:-70px 0 0 -70px;border-radius:50%;background:#fff;box-shadow:0 18px 40px rgba(60,70,140,.16),0 2px 6px rgba(60,70,140,.08);display:flex;align-items:center;justify-content:center}
.bub svg{width:64px;height:64px;fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.dot{border-radius:50%;background:#fff;box-shadow:0 4px 10px rgba(60,70,140,.15)}
.win{width:920px;height:860px;left:80px;top:560px;border-radius:30px;background:#fff;box-shadow:0 40px 100px rgba(70,60,160,.22);overflow:hidden;transform-origin:50% 50%}
.hdr{left:0;right:0;top:0;height:76px;display:flex;align-items:center;padding:0 28px;gap:18px;color:#fff;font-weight:700;font-size:26px}
.search{flex:1;height:44px;border-radius:12px;background:rgba(255,255,255,.22);display:flex;align-items:center;padding:0 18px;font-weight:500;font-size:22px;color:rgba(255,255,255,.85)}
.side{left:0;top:76px;bottom:0;width:210px;background:#F7F8FC;border-right:2px solid #EEF0F6;padding:22px 14px}
.nav{height:52px;border-radius:12px;display:flex;align-items:center;padding:0 14px;font-weight:600;font-size:19px;white-space:nowrap;color:#5B6086;gap:12px}
.nav i{width:18px;height:18px;border-radius:5px;background:#C9CDE3;display:block}
.main{left:210px;right:0;top:76px;bottom:0;padding:26px 30px}
.h2{font-weight:800;font-size:34px;letter-spacing:-.01em}
.chip{display:inline-flex;align-items:center;height:36px;padding:0 14px;border-radius:18px;font-weight:700;font-size:19px}
.row{height:86px;border-bottom:2px solid #F0F1F7;display:flex;align-items:center;gap:16px;font-size:22px;font-weight:600}
.av{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;color:#fff;flex:none}
.tab{left:84px;top:500px;display:flex;align-items:center;gap:12px;font-weight:700;font-size:40px}
.tab b{width:16px;height:16px;border-radius:50%;display:block}
.btnc{width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(60,70,140,.14)}
.btnc svg{width:50px;height:50px;fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.hl{left:0;right:0;text-align:center;font-weight:800;letter-spacing:-.02em}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="bag" viewBox="0 0 100 100">
    <path d="M22 34 h56 l-5 54 a6 6 0 0 1-6 5 H33 a6 6 0 0 1-6-5 z" fill="currentColor"/>

  <symbol id="i-truck" viewBox="0 0 64 64"><path d="M4 16h34v28H4zM38 26h12l10 10v8H38z"/><circle cx="16" cy="48" r="6"/><circle cx="48" cy="48" r="6"/></symbol>
  <symbol id="i-box" viewBox="0 0 64 64"><path d="M32 6 56 18v28L32 58 8 46V18z M8 18l24 12 24-12 M32 30v28"/></symbol>

  <symbol id="i-receipt" viewBox="0 0 64 64"><path d="M14 6h36v52l-6-4-6 4-6-4-6 4-6-4-6 4zM22 20h20M22 30h20M22 40h12"/></symbol>
  <symbol id="i-tag" viewBox="0 0 64 64"><path d="M34 6h22v22L28 56 6 34z"/><circle cx="45" cy="17" r="4"/></symbol>
  <symbol id="i-mail" viewBox="0 0 64 64"><rect x="6" y="14" width="52" height="36" rx="6"/><path d="M8 18l24 18 24-18"/></symbol>
  <symbol id="i-cal" viewBox="0 0 64 64"><rect x="8" y="12" width="48" height="44" rx="7"/><path d="M8 26h48M20 6v12M44 6v12"/></symbol>
  <symbol id="i-store" viewBox="0 0 64 64"><path d="M8 24 14 8h36l6 16M8 24c0 6 8 6 8 0 0 6 8 6 8 0 0 6 8 6 8 0 0 6 8 6 8 0 0 6 8 6 8 0M12 30v26h40V30M26 56V42h12v14"/></symbol>
  <symbol id="i-users" viewBox="0 0 64 64"><circle cx="24" cy="22" r="10"/><path d="M6 54c0-10 8-16 18-16s18 6 18 16M42 14a9 9 0 0 1 0 17M48 38c6 2 10 8 10 16"/></symbol>
  <symbol id="i-grid" viewBox="0 0 64 64"><rect x="8" y="10" width="48" height="44" rx="6"/><path d="M8 24h48M8 38h48M24 10v44M40 10v44"/></symbol>
  <symbol id="i-doc" viewBox="0 0 64 64"><path d="M16 6h22l12 12v40H16zM38 6v12h12M24 32h18M24 42h18"/></symbol>
  <symbol id="i-check" viewBox="0 0 64 64"><rect x="8" y="8" width="48" height="48" rx="10"/><path d="M20 33l8 8 16-18"/></symbol>
  <symbol id="i-clock" viewBox="0 0 64 64"><circle cx="32" cy="32" r="24"/><path d="M32 18v15l10 6"/></symbol>
  <symbol id="i-kanban" viewBox="0 0 64 64"><rect x="6" y="8" width="14" height="40" rx="4"/><rect x="25" y="8" width="14" height="28" rx="4"/><rect x="44" y="8" width="14" height="48" rx="4"/></symbol>
  <symbol id="i-gantt" viewBox="0 0 64 64"><path d="M8 14h26M18 28h30M28 42h28M8 56h18"/></symbol>
  <symbol id="i-dash" viewBox="0 0 64 64"><circle cx="32" cy="34" r="22"/><path d="M32 12v22l16 14"/></symbol>
  <symbol id="hand" viewBox="0 0 100 130">
    <g stroke="#1B1D3A" stroke-width="7" stroke-linejoin="round">
      <rect x="34" y="4" width="22" height="66" rx="11"/><rect x="54" y="40" width="18" height="34" rx="9"/><rect x="70" y="46" width="18" height="32" rx="9"/>
      <rect x="22" y="50" width="66" height="64" rx="24"/><rect x="2" y="66" width="38" height="18" rx="9" transform="rotate(38 21 75)"/>
    </g>
    <g fill="#fff">
      <rect x="34" y="4" width="22" height="66" rx="11"/><rect x="54" y="40" width="18" height="34" rx="9"/><rect x="70" y="46" width="18" height="32" rx="9"/>
      <rect x="22" y="50" width="66" height="64" rx="24"/><rect x="2" y="66" width="38" height="18" rx="9" transform="rotate(38 21 75)"/>
    </g>
    <path d="M56 58v14M72 62v12" stroke="#1B1D3A" stroke-width="4" stroke-linecap="round"/>
  </symbol>
</defs></svg>

<div class="abs" style="inset:0;background:radial-gradient(ellipse at 50% 45%,#F7F8FF 0%,#EDEFFA 55%,#E4E7F7 100%)"></div>
<div id="orbs"></div>
<svg class="abs" id="squig" style="left:0;top:0" width="1080" height="1920">
  <path id="sq1" d="M120 1020 c40 -40 80 40 120 0 s80 40 120 0 s70 30 100 0" stroke="#B8BDE0" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path id="sq2" d="M640 640 c30 -30 60 30 90 0 s60 30 90 0" stroke="#B8BDE0" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle id="ringline" cx="540" cy="960" r="420" stroke="#D8DCF2" stroke-width="3" fill="none"/>
</svg>
<div id="dots"></div>
<div id="bubs"></div>

<!-- intro headline -->
<div class="abs hl" id="hook" style="top:850px;font-size:76px;line-height:1.18"></div>
<div class="abs" id="toggle" style="left:0;right:0;top:880px;display:flex;align-items:center;justify-content:center;gap:30px">
  <div style="font-weight:800;font-size:110px;letter-spacing:-.03em">Teamwork</div>
  <div id="sw" style="width:180px;height:100px;border-radius:50px;background:#D5D8EC;position:relative;box-shadow:inset 0 2px 6px rgba(0,0,0,.08)">
    <div id="knob" class="abs" style="top:10px;left:10px;width:80px;height:80px;border-radius:50%;background:#fff;box-shadow:0 6px 14px rgba(0,0,0,.2)"></div></div>
</div>

<!-- views -->
<div class="abs hl" id="vhead" style="top:270px;font-size:66px;line-height:1.1"></div>
<div class="abs tab" id="tab"><b style="background:#FF5F57"></b><b style="background:#FEBC2E"></b><b style="background:#28C840"></b><span id="tabt" style="margin-left:14px"></span></div>
<div id="wins" style="position:absolute;inset:0;z-index:5"></div>
<div id="navbtns" style="position:absolute;left:0;top:0;z-index:20"></div>
<div id="floaters" style="position:absolute;left:0;top:0;z-index:20"></div>

<!-- outro -->
<div class="abs" id="logo" style="left:0;right:0;top:690px;height:200px">
  <svg class="abs" style="left:390px;top:0;overflow:visible" width="300" height="180" viewBox="0 0 100 60">
    <line id="lred" x1="12" y1="48" x2="28" y2="14" stroke="#FF3D57" stroke-width="15" stroke-linecap="round"/>
    <line id="lyel" x1="40" y1="48" x2="56" y2="14" stroke="#FFCB00" stroke-width="15" stroke-linecap="round"/>
    <circle id="lgrn" cx="80" cy="44" r="8.5" fill="#00CA72"/>
  </svg>
</div>
<div class="abs" id="word" style="left:0;right:0;top:930px;text-align:center;font-weight:700;font-size:136px;letter-spacing:-.02em;color:var(--ink)"></div>
<div class="abs hl" id="url" style="top:1140px;font-size:46px;font-weight:600;color:var(--muted)">Work management for every team</div>
<div class="abs" id="cta" style="left:280px;top:1270px;width:520px;height:124px;border-radius:62px;background:var(--purple);color:#fff;font-weight:600;font-size:46px;display:flex;align-items:center;justify-content:center;gap:16px;box-shadow:0 20px 50px rgba(97,97,255,.4)">Get Started <span style="font-size:44px">→</span></div>
<div class="abs hl" id="fine" style="top:1430px;font-size:32px;font-weight:500;color:var(--muted)">Free forever. No credit card needed.</div>

<svg class="abs" id="handEl" width="120" height="156" style="z-index:30;filter:drop-shadow(0 10px 14px rgba(30,30,80,.25))"><use href="#hand"/></svg>

<script>
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c=1.6,c3=c+1;return 1+c3*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
function rise(el,t,a,d=.45,dist=40){const p=eo(seg(t,a,a+d));el.style.opacity=p;el.style.transform=`translateY(${(1-p)*dist}px)`;return p}
function popv(t,a,d=.45){const p=seg(t,a,a+d);return p<=0?0:back(p)}

// ---------- orbs
const ORBS=[{r:230},{r:300},{r:80},{r:150}];
const orbEls=ORBS.map(o=>{const d=document.createElement('div');d.className='abs orb';d.style.width=d.style.height=o.r*2+'px';$('orbs').appendChild(d);return d});
// ---------- particles
const rnd=(s=>()=>(s=(s*16807)%2147483647)/2147483647)(42);
const DOTS=[...Array(26)].map(()=>({x:rnd()*1080,y:rnd()*1920,r:4+rnd()*10,p:rnd()*6.28,s:.3+rnd()*.7}));
const dotEls=DOTS.map(d=>{const e=document.createElement('div');e.className='abs dot';e.style.width=e.style.height=d.r*2+'px';$('dots').appendChild(e);return e});
// ---------- bubbles (generic commerce tools)
const BUBS=[['i-grid','#00C875',210,430,1.0],['i-mail','#579BFC',560,330,1.1],['i-chat','#A25DDC',880,470,.9],['i-doc','#579BFC',150,720,.85],
            ['i-cal','#FF3D57',935,730,1.05],['i-check','#00C875',190,1180,1.1],['i-clock','#FDAB3D',890,1190,.95],['i-chart','#6161FF',360,1420,.9],
            ['i-receipt','#FF7575',720,1440,1.15],['i-kanban','#FDAB3D',540,1660,.8]];
const bubEls=BUBS.map(b=>{const d=document.createElement('div');d.className='abs bub';d.innerHTML=`<svg style="stroke:${b[1]}"><use href="#${b[0]}"/></svg>`;$('bubs').appendChild(d);return d});
// ---------- hook text (typed)
const HOOK=['Forget switching','between tools!'];
// ---------- views (monday status colors)
const ST={done:['Done','#00C875'],work:['Working on it','#FDAB3D'],stuck:['Stuck','#E2445C']};
const VIEWS=[
 {name:'Main Table',color:'#6161FF',tint:'#ECECFF',icon:'i-grid',head:'Plan every project.'},
 {name:'Kanban',color:'#FDAB3D',tint:'#FFF2DE',icon:'i-kanban',head:'Move work forward.'},
 {name:'Timeline',color:'#579BFC',tint:'#E6F0FF',icon:'i-gantt',head:'See every deadline.'},
 {name:'Calendar',color:'#00C875',tint:'#DFF8EC',icon:'i-cal',head:'Never miss a date.'},
 {name:'Dashboard',color:'#E2445C',tint:'#FDE6EA',icon:'i-dash',head:'Track it all in one place.'},
];
const VT=[5.0,7.0,9.0,11.0,13.0]; // view start times
const NAVS=['Home','My work','Q4 Launch','Content plan','Sprints','Dashboards'];
const PEOPLE=[['Ava Martin','AM','#FDAB3D'],['Liam Chen','LC','#579BFC'],['Noah Patel','NP','#00C875'],['Mia Rossi','MR','#FF5AC4'],['Leo Garcia','LG','#A25DDC'],['Zoe Kim','ZK','#E2445C']];
const TASKS=[['Finalize launch plan',0,'done','Oct 6'],['Write release notes',1,'work','Oct 9'],['Design landing page',3,'stuck','Oct 12'],['QA mobile app',2,'work','Oct 14'],['Press outreach',4,'done','Oct 16'],['Launch webinar',5,'work','Oct 20']];
const av=(p,sz=44)=>`<div class="av" style="width:${sz}px;height:${sz}px;font-size:${sz*.36}px;background:${PEOPLE[p][2]}">${PEOPLE[p][1]}</div>`;
const pill=(k,cls='')=>`<span class="${cls}" style="display:inline-flex;align-items:center;justify-content:center;width:150px;height:40px;border-radius:6px;background:${ST[k][1]};color:#fff;font-size:17px;font-weight:600">${ST[k][0]}</span>`;
function shell(v){
  return `<div class="abs hdr" style="background:${v.color}"><svg width="54" height="32" viewBox="0 0 100 60"><line x1="12" y1="48" x2="28" y2="14" stroke="#fff" stroke-width="15" stroke-linecap="round"/><line x1="40" y1="48" x2="56" y2="14" stroke="#fff" stroke-width="15" stroke-linecap="round"/><circle cx="80" cy="44" r="8.5" fill="#fff"/></svg>Marketing<div class="search">Search</div>${av(4,44).replace('class="av"','class="av" style="border:3px solid rgba(255,255,255,.6)"')}</div>
  <div class="abs side">${NAVS.map((n,i)=>`<div class="nav" style="${i===2?`background:${v.tint};color:${v.color}`:''}"><i style="${i===2?`background:${v.color}`:''}"></i>${n}</div>`).join('')}</div>
  <div class="abs main"><div class="h2">Q4 Product Launch</div>
   <div style="display:flex;gap:20px;margin:12px 0 18px;border-bottom:2px solid #EEF0F6;font-size:17px;font-weight:600;color:#888">${VIEWS.map(w=>`<span style="padding:6px 0 10px;${w===v?`color:${v.color};border-bottom:4px solid ${v.color};margin-bottom:-2px`:''}">${w.name}</span>`).join('')}</div>
   ${body(v)}</div>`;
}
function body(v){
  if(v.name==='Main Table') return `
   <div class="b" style="display:flex;align-items:center;gap:10px;font-weight:700;font-size:21px;color:${v.color};margin-bottom:6px">▾ This sprint</div>
   <div class="row" style="height:42px;font-size:16px;color:#999;font-weight:600;border-left:6px solid ${v.color};padding-left:12px"><span style="width:230px">Task</span><span style="width:60px">Owner</span><span style="width:150px;text-align:center">Status</span><span>Due</span></div>
   ${TASKS.map((x,i)=>`<div class="row b" style="height:76px;font-size:19px;border-left:6px solid ${v.color};padding-left:12px"><span style="width:230px">${x[0]}</span><span style="width:60px">${av(x[1],42)}</span>${pill(x[2],i===2?'flip':'')}<span style="color:#777;font-size:17px">${x[3]}</span></div>`).join('')}`;
  if(v.name==='Kanban') return `
   <div style="display:flex;gap:14px;position:relative">${['work','stuck','done'].map(k=>`
    <div class="b" style="flex:1;border-radius:14px;background:#F5F6F8;padding:0 0 12px;min-height:600px">
     <div style="height:48px;border-radius:14px 14px 0 0;background:${ST[k][1]};color:#fff;font-weight:600;font-size:18px;display:flex;align-items:center;padding:0 14px">${ST[k][0]}</div>
     ${TASKS.filter(x=>x[2]===k&&x[0]!=='QA mobile app').map(x=>`<div style="height:96px;margin:12px 10px 0;background:#fff;border-radius:10px;padding:14px;box-shadow:0 2px 6px rgba(0,0,0,.06);font-size:17px;font-weight:600;line-height:1.3">${x[0]}<div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;color:#999;font-weight:500;font-size:15px">${x[3]}${av(x[1],34)}</div></div>`).join('')}
    </div>`).join('')}
    <div class="mover abs" style="left:10px;top:${48+12+2*(96+12)}px;height:96px;width:183px;background:#fff;border-radius:10px;padding:14px;box-shadow:0 14px 30px rgba(0,0,0,.18);font-size:17px;font-weight:600;line-height:1.3;border-left:5px solid #FDAB3D">QA mobile app<div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;color:#999;font-weight:500;font-size:15px">Oct 14${av(2,34)}</div></div>
   </div>`;
  if(v.name==='Timeline') return `
   <div style="display:flex;font-size:16px;color:#999;font-weight:600;margin-left:190px;border-bottom:2px solid #F0F1F7;padding-bottom:8px">${['Oct','Nov','Dec'].map(m=>`<span style="flex:1">${m}</span>`).join('')}</div>
   <div style="position:relative">
   ${TASKS.map((x,i)=>{const s0=[0,.12,.25,.4,.52,.68][i],w=[.22,.25,.3,.24,.3,.28][i];return `<div class="row b" style="height:80px;font-size:17px"><span style="width:180px;line-height:1.2">${x[0]}</span><div style="flex:1;position:relative;height:44px"><div class="gbar abs" data-w="${w}" style="left:${s0*100}%;top:0;height:44px;width:0;border-radius:22px;background:${['#579BFC','#A25DDC','#FDAB3D','#00C875','#FF5AC4','#579BFC'][i]};display:flex;align-items:center;justify-content:flex-end;padding-right:4px;overflow:hidden">${av(x[1],36)}</div></div></div>`}).join('')}
   <div class="today abs" style="left:${190+0.45*440}px;top:0;bottom:0;width:3px;background:#E2445C"></div></div>`;
  if(v.name==='Calendar'){
   const ev={2:['Kickoff','#6161FF'],6:['Release notes','#FDAB3D'],9:['Design review','#A25DDC'],12:['QA sprint','#00C875'],15:['Press day','#FF5AC4'],18:['Webinar','#579BFC'],23:['Retro','#E2445C']};
   return `<div style="display:flex;justify-content:space-between;font-weight:700;font-size:21px;margin-bottom:10px">October 2026<span style="color:#999;font-weight:500;font-size:17px">Month</span></div>
   <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-size:15px;color:#999;font-weight:600;margin-bottom:6px">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<span>${d}</span>`).join('')}</div>
   <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px">${[...Array(28)].map((_,i)=>`<div style="height:108px;border-radius:10px;background:#F7F8FC;padding:6px;font-size:15px;color:#777;font-weight:600">${i+1}${ev[i]?`<div class="ev" style="margin-top:6px;border-radius:6px;padding:4px 5px;background:${ev[i][1]};color:#fff;font-size:12px;font-weight:600;line-height:1.15">${ev[i][0]}</div>`:''}</div>`).join('')}</div>`;}
  if(v.name==='Dashboard') return `
   <div style="display:flex;gap:14px">${[['Tasks done','128','k1'],['On track','92%','k2'],['Overdue','3','k3']].map(k=>`
     <div class="b" style="flex:1;border-radius:16px;background:${v.tint};padding:16px"><div style="font-size:16px;color:#777;font-weight:600">${k[0]}</div><div id="${k[2]}" style="margin-top:4px;font-weight:700;font-size:34px;color:${k[2]==='k3'?'#E2445C':'#323338'}">${k[1]}</div></div>`).join('')}</div>
   <div style="display:flex;gap:14px;margin-top:16px">
    <div class="b" style="width:250px;height:420px;border-radius:16px;border:2px solid #F0F1F7;padding:16px;position:relative">
      <div style="font-weight:700;font-size:18px">Status</div>
      <div id="donut" class="abs" style="left:35px;top:70px;width:180px;height:180px;border-radius:50%"></div>
      <div class="abs" style="left:80px;top:115px;width:90px;height:90px;border-radius:50%;background:#fff"></div>
      <div class="abs" style="left:18px;top:285px;font-size:15px;line-height:1.9;font-weight:600;color:#555">${['done','work','stuck'].map(k=>`<div><b style="display:inline-block;width:12px;height:12px;border-radius:3px;background:${ST[k][1]};margin-right:8px"></b>${ST[k][0]}</div>`).join('')}</div>
    </div>
    <div class="b" style="flex:1;height:420px;border-radius:16px;border:2px solid #F0F1F7;padding:16px;position:relative">
      <div style="font-weight:700;font-size:18px">Done per week</div>
      <div class="abs" style="left:20px;right:20px;bottom:46px;height:300px;display:flex;align-items:flex-end;gap:14px">${[.3,.45,.4,.6,.72,.95].map((h,i)=>`<div class="vbar" data-h="${h}" style="flex:1;height:0;border-radius:8px 8px 3px 3px;background:${i===5?'#00C875':'#BDEFD7'}"></div>`).join('')}</div>
      <div class="abs" style="left:20px;right:20px;bottom:14px;display:flex;gap:14px;font-size:14px;color:#999;font-weight:600">${['W1','W2','W3','W4','W5','W6'].map(d=>`<span style="flex:1;text-align:center">${d}</span>`).join('')}</div>
    </div></div>`;
}
const winEls=VIEWS.map(v=>{const d=document.createElement('div');d.className='abs win';d.innerHTML=shell(v);$('wins').appendChild(d);return d});
// nav buttons
const BX=k=>240+150*k, BY=1590;
const btnEls=VIEWS.map((v,k)=>{const d=document.createElement('div');d.className='abs btnc';d.style.left=BX(k)+'px';d.style.top=BY+'px';d.innerHTML=`<svg><use href="#${v.icon}"/></svg>`;$('navbtns').appendChild(d);return d});
// floating customer bubbles around the store view
const FL=[[0,130,640,'✓ Done'],[3,950,900,'@mentioned you'],[1,110,1260,'✓ Approved']];
const flEls=FL.map(f=>{const d=document.createElement('div');d.className='abs';d.style.left=f[1]+'px';d.style.top=f[2]+'px';
  d.innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;gap:10px;margin-left:-60px;width:120px"><div class="av" style="width:110px;height:110px;font-size:36px;background:${PEOPLE[f[0]][2]};border:6px solid #fff;box-shadow:0 14px 30px rgba(60,70,140,.25)">${PEOPLE[f[0]][1]}</div><span class="chip" style="background:#fff;color:#323338;box-shadow:0 6px 16px rgba(60,70,140,.18);white-space:nowrap">${f[3]}</span></div>`;
  $('floaters').appendChild(d);return d});
// wordmark letters
$('word').innerHTML=[...'monday.com'].map((c,i)=>`<span style="display:inline-block;${i>=6?'font-weight:400':''}">${c}</span>`).join('');
const letters=[...$('word').children];

function viewIndexAt(t){let c=0;for(let k=1;k<VT.length;k++)c+=eio(seg(t,VT[k],VT[k]+.5));return c}

function render(t){
  // ---- orbs drift (positions change per section)
  const out=seg(t,14.7,15.6);
  const O=[[1010+30*Math.sin(t*.6),130+25*Math.cos(t*.5)],[40+30*Math.cos(t*.4),1830+30*Math.sin(t*.5)],[110+20*Math.sin(t*.9),560+30*Math.cos(t*.7)],[1060+20*Math.cos(t*.8),1500+30*Math.sin(t*.6)]];
  const O2=[[90,600],[1000,1800],[860,420],[1200,1500]];
  ORBS.forEach((o,i)=>{const p=eio(out);let x=lerp(O[i][0],O2[i][0],p),y=lerp(O[i][1],O2[i][1],p);
    const intro=eo(seg(t,0+i*.12,.9+i*.12));const s=lerp(.2,1,intro)*(i===3?lerp(0,1,seg(t,4.5,5.2)):1);
    orbEls[i].style.left=(x-o.r)+'px';orbEls[i].style.top=(y-o.r)+'px';orbEls[i].style.transform=`scale(${s})`;orbEls[i].style.opacity=intro*.88;});
  // ---- particles
  DOTS.forEach((d,i)=>{const e=dotEls[i];const a=seg(t,.1+i*.02,.6+i*.02);e.style.left=(d.x+Math.sin(t*d.s+d.p)*20)+'px';e.style.top=(d.y-t*12*d.s)+'px';e.style.opacity=a*.9*(1-seg(t,4.4,5.0)*.6)});
  // squiggles
  ['sq1','sq2'].forEach((id,i)=>{const p=$(id);const L=520;p.style.strokeDasharray=L;p.style.strokeDashoffset=L*(1-eo(seg(t,.6+i*.3,1.6+i*.3)));p.style.opacity=1-seg(t,4.2,4.6)});
  $('ringline').style.opacity=seg(t,.3,1)*(1-seg(t,4.2,4.6))*.8;$('ringline').setAttribute('r',380+t*8);
  // ---- bubbles: pop in, float, then get sucked into the window
  const suck=eio(seg(t,4.2,4.85));
  BUBS.forEach((b,i)=>{const e=bubEls[i];const a=.15+i*.09;const s=popv(t,a,.5)*b[4];
    const fx=b[2]+Math.sin(t*1.1+i)*14, fy=b[3]+Math.cos(t*.9+i*2)*16;
    const x=lerp(fx,540,suck), y=lerp(fy,990,suck);
    e.style.left=x+'px';e.style.top=y+'px';e.style.transform=`scale(${s*(1-suck*.8)})`;e.style.opacity=t<a?0:1-seg(t,4.6,4.85);
    e.style.display=t>4.9?'none':'flex';});
  // ---- hook: typed
  {const el=$('hook');const total=HOOK.join('').length;const n=Math.floor(clamp((t-1.0)/0.8)*total);
   let rem=n;el.innerHTML=HOOK.map(l=>{const s=l.slice(0,Math.max(0,rem));rem-=l.length;return s}).join('<br>')+(n<total&&t>1?'<span style="color:#7B6CFF">|</span>':'');
   const o=1-seg(t,3.3,3.55);el.style.opacity=o;el.style.transform=`translateY(${-seg(t,3.3,3.55)*30}px)`;el.style.display=t>3.6?'none':'block';}
  // ---- toggle
  {const el=$('toggle');const a=rise(el,t,3.55,.4,40);const o=1-seg(t,4.3,4.5);el.style.opacity=a*o;el.style.display=(t>3.5&&t<4.55)?'flex':'none';
   const k=eio(seg(t,3.95,4.2));$('knob').style.left=lerp(10,90,k)+'px';$('sw').style.background=k>.5?'#6161FF':'#D5D8EC';
   el.style.transform+=` scale(${1-seg(t,4.3,4.5)*.2})`;}
  // ---- views
  const inV=t>=4.5&&t<15.4;
  const c=viewIndexAt(t);const ci=Math.round(c);
  const winIn=t<5.2?back(seg(t,4.55,5.1)):1;
  const winOut=eio(seg(t,14.85,15.3));
  VIEWS.forEach((v,i)=>{const w=winEls[i];const d=i-c;const ad=Math.min(Math.abs(d),1.4);
    if(!inV||Math.abs(d)>1.6){w.style.display='none';return}
    w.style.display='block';
    const s=(1-.18*Math.min(ad,1))*(i===0&&t<5.2?lerp(.2,1,winIn):1)*(1-winOut*.3);
    w.style.transform=`translateX(${d*930}px) scale(${s})`;
    w.style.filter=ad>.02?`blur(${Math.min(ad,1)*7}px)`:'none';
    w.style.opacity=(1-.5*Math.min(ad,1))*(i===0&&t<5.2?clamp(seg(t,4.55,4.8)):1)*(1-winOut);
    w.style.zIndex=10-Math.round(ad*5);
    // inner builds keyed on local view time
    const lt=t-VT[i]+(i===0?0.15:0);
    w.querySelectorAll('.b').forEach((b,j)=>{const p=eo(seg(lt,.12+j*.08,.47+j*.08));b.style.opacity=i===0&&t<5.2?1:p;b.style.transform=`translateY(${(1-p)*24}px)`});
        w.querySelectorAll('.vbar').forEach((b,j)=>{b.style.height=(eo(seg(lt,.45+j*.06,1.0+j*.06))*b.dataset.h*100)+'%'});
    if(v.name==='Main Table'){const fl=w.querySelector('.flip');const d=lt>1.25;fl.textContent=d?'Done':'Stuck';fl.style.background=d?'#00C875':'#E2445C';fl.style.transform=`scale(${1+(seg(lt,1.25,1.35)-seg(lt,1.35,1.55))*.15})`}
    if(v.name==='Kanban'){const m=w.querySelector('.mover');const q=eio(seg(lt,.75,1.35));const lift=seg(lt,.6,.75)-seg(lt,1.35,1.5);
      m.style.transform=`translate(${q*2*(203+14)}px,${-Math.sin(q*Math.PI)*60-lift*10}px) rotate(${Math.sin(q*Math.PI)*4}deg)`;m.style.opacity=clamp(seg(lt,.35,.6));m.style.borderLeftColor=q>.5?'#00C875':'#FDAB3D';}
    if(v.name==='Timeline'){w.querySelectorAll('.gbar').forEach((b,j)=>{b.style.width=(eio(seg(lt,.35+j*.1,1.0+j*.1))*b.dataset.w*100)+'%'});}
    if(v.name==='Calendar'){w.querySelectorAll('.ev').forEach((e,j)=>{const p=popv(lt,.4+j*.1,.35);e.style.transform=`scale(${p})`;e.style.opacity=clamp(p*2)});}
    if(v.name==='Dashboard'){const k=eo(seg(lt,.4,1.4));$('k1').textContent=Math.round(128*k);$('k2').textContent=Math.round(92*k)+'%';$('k3').textContent=Math.round(3*k);
      const d=eio(seg(lt,.4,1.3))*360;$('donut').style.background=`conic-gradient(#00C875 0 ${Math.min(d,223)}deg,#FDAB3D ${Math.min(d,223)}deg ${Math.min(d,324)}deg,#E2445C ${Math.min(d,324)}deg ${d}deg,#EEF0F6 ${d}deg 360deg)`;}
  });
  // headline + tab
  {const vh=$('vhead'),tb=$('tab');
   const k=Math.min(4,Math.max(0,VT.filter(x=>t>=x+.2).length-1));
   let p=t<5?eo(seg(t,4.8,5.2)):(k===0?1:eo(seg(t,VT[k]+.2,VT[k]+.5)));
   if(k<4)p*=1-seg(t,VT[k+1]-.15,VT[k+1]+.1);
   const o=inV?(1-winOut):0;
   vh.textContent=VIEWS[k].head;tb.querySelector('#tabt').textContent=VIEWS[k].name+' View';tb.querySelector('#tabt').style.color=VIEWS[k].color;
   vh.style.opacity=p*o;vh.style.transform=`translateY(${(1-p)*30}px)`;tb.style.opacity=p*o;tb.style.transform=`translateX(${(1-p)*-30}px)`;
   vh.style.display=tb.style.display=inV?'':'none';}
  // nav buttons
  btnEls.forEach((b,k)=>{const s=popv(t,4.9+k*.07,.4)*(1-winOut);b.style.transform=`scale(${s})`;b.style.display=inV?'flex':'none';
    const active=(k===0&&t<VT[1]-.12)||(k>0&&t>=VT[k]-.12&&(k===4||t<VT[k+1]-.12));
    b.style.background=active?VIEWS[k].color:'#E1E4F5';b.querySelector('svg').style.stroke=active?'#fff':'#9AA0C8';
    const press=k>0?(seg(t,VT[k]-.2,VT[k]-.12)-seg(t,VT[k]-.12,VT[k]+.05)):0;b.style.transform+=` scale(${1-press*.12})`;});
  // floating customer bubbles (store view)
  flEls.forEach((e,i)=>{const s=popv(t,5.55+i*.25,.45);const o=1-seg(t,6.75,6.95);e.style.transform=`scale(${s*o}) translateY(${Math.sin(t*2+i)*6}px)`;e.style.opacity=o;e.style.display=(t>5.5&&t<7)?'block':'none'});
  // ---- hand cursor
  {const h=$('handEl');let x=1200,y=2000,press=0;
   const rest=k=>[BX(k)+18,BY+30];
   if(t<15){
     const enter=eio(seg(t,5.9,6.5));let [px,py]=rest(0);x=lerp(1150,px,enter);y=lerp(2000,py,enter);
     for(let k=1;k<5;k++){const m=eio(seg(t,VT[k]-.65,VT[k]-.2));if(m>0){const [ax,ay]=rest(k-1),[bx,by]=rest(k);x=lerp(ax,bx,m);y=lerp(ay,by,m)-Math.sin(m*Math.PI)*40;}
       press=Math.max(press,seg(t,VT[k]-.2,VT[k]-.12)-seg(t,VT[k]-.12,VT[k]+.02));}
     const ex=eio(seg(t,14.3,14.9));x=lerp(x,1200,ex);y=lerp(y,2050,ex);
   } else {
     const m=eio(seg(t,16.9,17.6));x=lerp(1200,700,m);y=lerp(2050,1360,m)-Math.sin(m*Math.PI)*60;
     press=seg(t,17.75,17.83)-seg(t,17.83,18.0);
     const r=eio(seg(t,18.1,18.6));x=lerp(x,1180,r);y=lerp(y,1900,r);
   }
   h.style.left=(x-40)+'px';h.style.top=(y-4)+'px';h.style.transform=`scale(${1-press*.12})`;h.style.transformOrigin='35% 3%';}
  // ---- outro
  const showO=t>=15.0;
  ['logo','word','url','cta','fine'].forEach(id=>$(id).style.display=showO?'block':'none');$('cta').style.display=showO?'flex':'none';
  if(showO){
    const a=eo(seg(t,15.3,15.85)),b=eo(seg(t,15.45,16.0)),c2=eo(seg(t,15.75,16.15));
    for(const [id,p,dx,dy] of [['lred',a,-40,30],['lyel',b,30,-40]]){const e=$(id);e.style.transform=`translate(${(1-p)*dx}px,${(1-p)*dy}px)`;e.style.opacity=p;e.style.transformBox='fill-box';e.style.transformOrigin='50% 50%';}
    
    {const g=$('lgrn');g.style.transformBox='fill-box';g.style.transformOrigin='50% 50%';g.style.transform=`scale(${popv(t,15.75,.4)})`;}
    const lg=$('logo');const sq=seg(t,15.95,16.25)-seg(t,16.25,16.5);lg.style.transform=`scale(${1+sq*.06})`;
    letters.forEach((l,i)=>{const p=eo(seg(t,16.0+i*.04,16.45+i*.04));l.style.opacity=p;l.style.transform=`translateX(${(i-4.5)*(1-p)*50}px)`});
    rise($('url'),t,16.45,.45,30);rise($('fine'),t,17.0,.45,20);
    {const s=popv(t,16.7,.5);$('cta').style.transform=`scale(${s})`;$('cta').style.opacity=clamp(s*2);
     const pr=seg(t,17.75,17.83)-seg(t,17.83,18.0);$('cta').style.transform+=` scale(${1-pr*.06})`;
     const g=seg(t,17.85,18.6);$('cta').style.boxShadow=`0 20px 50px rgba(97,97,255,.4),0 0 0 ${g*34}px rgba(97,97,255,${.3*(1-g)})`;}
  }
}
window.render=render;
window.ready=document.fonts.ready.then(()=>true);
</script>
